apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "dev.vesper.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "dev.vesper.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        // The Linux runtime ships arm64 binaries only. A 32-bit or x86 device has
        // no usable PRoot rootfs here, so refuse to install rather than start and
        // fail at exec time.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Release signing is supplied by CI through the environment. Without it the
    // release APK is unsigned (installable only after manual signing), so the
    // workflow falls back to a debug APK rather than shipping a broken artefact.
    signingConfigs {
        release {
            def storePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Capacitor 7 targets Java 21; the Kotlin target must match or Gradle fails
    // with an inconsistent-JVM-target error at assemble time.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "org.apache.commons:commons-compress:$commonsCompressVersion"
    implementation project(':capacitor-android')
}

apply from: 'capacitor.build.gradle'
