name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: desktop · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Both builders may touch the same GitHub release; serialize them.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            command: --win nsis
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-latest
            command: --linux AppImage
            artifacts: |
              release/*.AppImage
              release/latest-linux.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build console and server
        run: npm run build:desktop

      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            npx electron-builder ${{ matrix.command }} --publish always
          else
            npx electron-builder ${{ matrix.command }} --publish never
          fi

      - name: Upload installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: vesper-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ matrix.artifacts }}

  android:
    name: android · arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The action's default `tools` package no longer exists in Google's
          # SDK repo, which makes sdkmanager exit 1. Install only what's needed.
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install
        run: npm ci

      - name: Cache the pinned Linux runtime
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: vesper-runtime-v1

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Pin the phone runtime
        run: npm run mobile:runtime

      - name: Build the mobile payload
        run: npm run mobile:sync

      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vesper.keystore"
            echo "path=$RUNNER_TEMP/vesper.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - attaching a debug APK to the release. Add the secret to ship a signed build."
          fi

      - name: Assemble
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi

      - name: Stage the APK
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk vesper-arm64.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk vesper-arm64-debug.apk
          fi
          ls -lh vesper-arm64*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: vesper-android
          path: vesper-arm64*.apk
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: vesper-arm64*.apk
          generate_release_notes: true

  cli:
    name: cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stage the CLI
        run: |
          mkdir -p cli-out
          cp cli/vesper.mjs cli-out/vesper.mjs
          chmod +x cli-out/vesper.mjs
          {
            echo "Vesper CLI $(node -p "require('./package.json').version")"
            echo "Requires Node 20+ (no dependencies, no build step)."
            echo "Run: node vesper.mjs"
            echo "Or copy vesper.mjs to a folder on PATH and chmod +x to call it as 'vesper'."
          } > cli-out/README.txt
          ls -lh cli-out

      - name: Upload the CLI
        uses: actions/upload-artifact@v4
        with:
          name: vesper-cli
          path: cli-out/*
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: cli-out/*
          generate_release_notes: true
